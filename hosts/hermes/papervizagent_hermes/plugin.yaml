manifest_version: 1
name: papervizagent
version: 0.5.0
description: Scientific figures with upstream PaperVizAgent, separate roles,
  configurable model providers and Codex subscription fallback. Host-native
  defaults where tools are available.
author: GoatInAHat
license: Apache-2.0
homepage: https://github.com/GoatInAHat/PaperVizAgent
provides_tools:
  - generate
  - infer
  - models
  - status
  - web
optional_env:
  - name: PAPERVIZAGENT_CONFIG
    description: Optional path to shared PaperVizAgent JSON/YAML model and pipeline
      configuration.
  - name: CODEX_OAUTH_TOKEN
    description: Optional externally supplied Codex OAuth access token. Existing
      Codex sign-in is used when omitted.
    secret: true
  - name: CODEX_ACCOUNT_ID
    description: Optional account ID for an external token whose JWT does not contain it.
  - name: GOOGLE_API_KEY
    description: Optional Gemini API key.
    secret: true
  - name: OPENAI_API_KEY
    description: Optional OpenAI API key, separate from Codex OAuth.
    secret: true
  - name: ANTHROPIC_API_KEY
    description: Optional Anthropic API key.
    secret: true
python_dependencies:
  - papervizagent>=0.5.0,<1

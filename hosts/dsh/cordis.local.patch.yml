# tf:mcp
- insert:
    - id: mcp-papervizagent
      name: "@deepseek-ai/dsh-mcp-client"
      config:
        serverName: papervizagent
        transport: stdio
        command: uv
        args:
          - run
          - --quiet
          - python
          - -m
          - papervizagent.toolfactory.mcp
        env:
          PAPERVIZAGENT_CONFIG: !!js process.env.PAPERVIZAGENT_CONFIG ?? ""
          CODEX_OAUTH_TOKEN: !!js process.env.CODEX_OAUTH_TOKEN ?? ""
          CODEX_ACCOUNT_ID: !!js process.env.CODEX_ACCOUNT_ID ?? ""
          GOOGLE_API_KEY: !!js process.env.GOOGLE_API_KEY ?? ""
          OPENAI_API_KEY: !!js process.env.OPENAI_API_KEY ?? ""
          ANTHROPIC_API_KEY: !!js process.env.ANTHROPIC_API_KEY ?? ""
        failOnStartupError: true
# /tf:mcp

# Yours: add Cordis rows or local code configuration below this marker.

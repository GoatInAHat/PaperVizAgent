- insert:
    - id: mcp-papervizagent-codex
      name: "@deepseek-ai/dsh-mcp-client"
      config:
        serverName: papervizagent-codex
        transport: stdio
        command: uv
        args:
          - run
          - --quiet
          - python
          - -m
          - papervizagent_codex.toolfactory.mcp
        env:
          PAPERVIZAGENT_CODEX_CONFIG: !!js process.env.PAPERVIZAGENT_CODEX_CONFIG ?? ""
          CODEX_OAUTH_TOKEN: !!js process.env.CODEX_OAUTH_TOKEN ?? ""
          CODEX_ACCOUNT_ID: !!js process.env.CODEX_ACCOUNT_ID ?? ""
          GOOGLE_API_KEY: !!js process.env.GOOGLE_API_KEY ?? ""
          OPENAI_API_KEY: !!js process.env.OPENAI_API_KEY ?? ""
          ANTHROPIC_API_KEY: !!js process.env.ANTHROPIC_API_KEY ?? ""
        failOnStartupError: true

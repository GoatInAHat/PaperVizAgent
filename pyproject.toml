[project]
name = "papervizagent"
version = "0.4.0"
description = "Scientific figures with upstream PaperVizAgent, separate roles, configurable model providers and Codex subscription fallback. Host-native defaults where tools are available."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [ "mcp>=2,<3", "pydantic>=2", "PyYAML>=6", "openai-codex==0.147.0", "google-genai>=1", "openai>=2", "anthropic[vertex]>=0.70", "Pillow>=11", "matplotlib>=3.9", "numpy>=2", "tqdm>=4", "json-repair>=0.30" ]
keywords = [ "scientific-figures", "research", "papervizagent", "paperbanana", "codex" ]

[[project.authors]]
name = "GoatInAHat"

[project.scripts]
papervizagent = "papervizagent.toolfactory.cli:main"

[project.urls]
Repository = "https://github.com/GoatInAHat/PaperVizAgent"
Homepage = "https://github.com/GoatInAHat/PaperVizAgent"

[build-system]
requires = [ "hatchling" ]
build-backend = "hatchling.build"

[tool.hatch.build]
artifacts = [ "web/dist/**" ]

[tool.hatch.build.targets.wheel]
packages = [ "src/papervizagent" ]
only-include = [ "src/papervizagent", "web/dist" ]

[tool.hatch.build.targets.wheel.sources]
src = ""
"web/dist" = "papervizagent/web"

[tool.hatch.build.targets.sdist]
only-include = [ "pyproject.toml", "README.md", "LICENSE", "LICENSE.md", "LICENSE.txt", "NOTICE", "NOTICE.md", "NOTICE.txt", "src/papervizagent", "web/dist" ]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = [ "tests" ]

[dependency-groups]
dev = [ "pytest>=8", "pytest-asyncio>=1" ]


# Adopted from ToolFactory 0.2.1 for workflow permissions and container inputs.
# `gate` decides once which registries this tag can publish to (a job-level `if` cannot read
# secrets) and every leg obeys its output, so a tag with no secrets is still green: gate,
# package, the Release, and whatever else applies. After adding a secret, re-run with
# `gh workflow run release.yml -f tag=vX.Y.Z` — never `gh run rerun`, which replays the
# original run's secret snapshot. `release` first retracts every registry a surface dropped
# since the previous tag published to (git is the ledger; `toolfactory unpublish`), and
# `toolfactory secrets status` / `bootstrap-repo` cover the one-time steps that are left.
#
# ClawHub's GitHub-OIDC trusted publishing covers `workflow_dispatch` only, not
# `push: tags` — this leg is the one that is not secretless (§7): it needs a stored
# CLAWHUB_TOKEN repo secret, and `clawhub package trusted-publisher set` does not help here.
#
# ClawHub skill publishing has no OIDC trusted-publishing path yet (V1 is token-only,
# per its own docs) — this leg reuses the same stored CLAWHUB_TOKEN as publish-clawhub.
#
# None of Chrome Web Store, Firefox Add-ons or Edge Add-ons supports GitHub OIDC — like
# CLAWHUB_TOKEN above, publish-browser-ext is a stored-secrets leg, gated per store on that
# store's own secrets (nine names across the three stores); a store left unconfigured is
# skipped, never a failure, and the leg's own dry run runs on every push and pull request.
#
# Pages must be enabled with Source = GitHub Actions once (`toolfactory bootstrap-repo` does
# it through gh); until then the gate skips the Pages pair with a notice.

name: Release
on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      tag:
        description: "The v* tag to release: an existing one to publish again (e.g. after adding a secret), or a new one to cut at this branch's head"
        required: true
        type: string
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    outputs:
      sha: ${{ steps.tag.outputs.sha }}
      npm: ${{ steps.presence.outputs.npm }}
      pypi: ${{ steps.presence.outputs.pypi }}
      oci: ${{ steps.presence.outputs.oci }}
      mcp_registry: ${{ steps.presence.outputs.mcp_registry }}
      clawhub_package: ${{ steps.presence.outputs.clawhub_package }}
      clawhub_skill: ${{ steps.presence.outputs.clawhub_skill }}
      pages: ${{ steps.presence.outputs.pages }}
      chrome: ${{ steps.presence.outputs.chrome }}
      firefox: ${{ steps.presence.outputs.firefox }}
      edge: ${{ steps.presence.outputs.edge }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - id: tag
        name: the commit this tag releases
        run: sha=$(git rev-parse -q --verify "refs/tags/$RELEASE_TAG^{commit}" 2>/dev/null || git rev-parse HEAD) && git checkout -q "$sha" && echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: tag matches plugin.json
        run: test "v$(node -p "require('./plugin.json').version")" = "$RELEASE_TAG"
      - name: Restore Hermes
        id: hermes
        uses: actions/cache@v4
        with:
          path: |-
            ~/.hermes
            ~/.local/bin/hermes*
            ~/.local/share/uv/python
          key: hermes-${{ runner.os }}-180291162ff4df0d42b5dc4fecd08005cf7cebf9
      - name: Install Hermes
        if: steps.hermes.outputs.cache-hit != 'true'
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ github.token }}@github.com/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/
        run: curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash -s -- --commit 180291162ff4df0d42b5dc4fecd08005cf7cebf9 --skip-setup --skip-browser --skip-computer-use --non-interactive --no-skills
      - name: Hermes on PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: install
        run: uv sync
      - name: Install core into Hermes
        run: uv pip install --python "$HOME/.hermes/hermes-agent/venv/bin/python" --editable .
      - name: toolfactory check
        run: npx --yes toolfactory@0.2.1 check
      - name: toolfactory build (output files)
        run: npx --yes toolfactory@0.2.1 build
      - name: Install Claude Code CLI
        run: npm i -g @anthropic-ai/claude-code
      - name: Install Chromium dependencies
        run: npx --yes playwright install-deps chromium
      - name: toolfactory validate
        run: npx --yes toolfactory@0.2.1 validate
      - name: author tests
        run: uv run --with pytest pytest -q
      - name: openclaw end-to-end (scripted model, no LLM key)
        run: npm --prefix hosts/openclaw run --if-present test:e2e
      - id: presence
        name: which registries this tag can publish to
        env:
          GH_TOKEN: ${{ github.token }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TRUSTED_PUBLISHER: ${{ vars.NPM_TRUSTED_PUBLISHER }}
          PYPI_TRUSTED_PUBLISHER: ${{ vars.PYPI_TRUSTED_PUBLISHER }}
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
          CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}
          FIREFOX_EXTENSION_ID: ${{ secrets.FIREFOX_EXTENSION_ID }}
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
        run: |-
          npm=false; if [ "$NPM_TRUSTED_PUBLISHER" = true ] || [ -n "$NPM_TOKEN" ]; then npm=true; else echo "::notice::npm: not published at this tag — https://www.npmjs.com/settings/~/tokens"; fi; echo "npm=$npm" >> "$GITHUB_OUTPUT"
          pypi=false; if curl -fsS -o /dev/null https://pypi.org/pypi/papervizagent/json || [ -n "$PYPI_TRUSTED_PUBLISHER" ]; then pypi=true; else echo "::notice::pypi: not published at this tag — https://pypi.org/manage/account/publishing/"; fi; echo "pypi=$pypi" >> "$GITHUB_OUTPUT"
          oci=false; if echo "::notice::ghcr.io publishes a private image on the first push whatever the repository's visibility; make it public once at https://github.com/goatinahat?tab=packages -> Package settings -> Danger Zone."; then oci=true; else echo "::notice::oci: not published at this tag — https://github.com/settings/packages"; fi; echo "oci=$oci" >> "$GITHUB_OUTPUT"
          mcp_registry=false; if [ "$npm" = true ] && [ "$pypi" = true ] && [ "$oci" = true ]; then mcp_registry=true; else echo "::notice::mcp-registry: not published at this tag — https://registry.modelcontextprotocol.io"; fi; echo "mcp_registry=$mcp_registry" >> "$GITHUB_OUTPUT"
          clawhub_package=false; if [ -n "$CLAWHUB_TOKEN" ]; then clawhub_package=true; else echo "::notice::clawhub-package: not published at this tag — https://clawhub.ai"; fi; echo "clawhub_package=$clawhub_package" >> "$GITHUB_OUTPUT"
          clawhub_skill=false; if [ -n "$CLAWHUB_TOKEN" ]; then clawhub_skill=true; else echo "::notice::clawhub-skill: not published at this tag — https://clawhub.ai"; fi; echo "clawhub_skill=$clawhub_skill" >> "$GITHUB_OUTPUT"
          pages=false; if gh api repos/GoatInAHat/PaperVizAgent/pages >/dev/null 2>&1; then pages=true; else echo "::notice::pages: not published at this tag — https://github.com/GoatInAHat/PaperVizAgent/settings/pages"; fi; echo "pages=$pages" >> "$GITHUB_OUTPUT"
          chrome=false; if [ -n "$CHROME_EXTENSION_ID" ] && [ -n "$CHROME_PUBLISHER_ID" ] && [ -n "$CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL" ] && [ -n "$CHROME_SERVICE_ACCOUNT_PRIVATE_KEY" ]; then chrome=true; else echo "::notice::chrome: not published at this tag — https://chrome.google.com/webstore/devconsole"; fi; echo "chrome=$chrome" >> "$GITHUB_OUTPUT"
          firefox=false; if [ -n "$FIREFOX_EXTENSION_ID" ] && [ -n "$FIREFOX_JWT_ISSUER" ] && [ -n "$FIREFOX_JWT_SECRET" ]; then firefox=true; else echo "::notice::firefox: not published at this tag — https://addons.mozilla.org/developers/addon/api/key/"; fi; echo "firefox=$firefox" >> "$GITHUB_OUTPUT"
          edge=false; if [ -n "$EDGE_PRODUCT_ID" ] && [ -n "$EDGE_CLIENT_ID" ] && [ -n "$EDGE_API_KEY" ]; then edge=true; else echo "::notice::edge: not published at this tag — https://partner.microsoft.com/dashboard/microsoftedge/publishapi"; fi; echo "edge=$edge" >> "$GITHUB_OUTPUT"
  package:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
      FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: release directory
        run: rm -rf dist/release && mkdir -p dist/release
      - name: install
        run: uv sync
      - name: toolfactory build (output files)
        run: npx --yes toolfactory@0.2.1 build
      - name: web build
        run: npm -C web ci && npm -C web run build
        env:
          PAGES_BASE: /
      - name: npm tarball
        run: npm pack --pack-destination dist/release
      - name: python distributions
        run: uv build --out-dir dist/release/pypi
      - name: MCPB bundle
        run: rm -rf dist/mcpb && mkdir -p dist/mcpb && tar -xzf dist/release/pypi/*.tar.gz -C dist/mcpb --strip-components=1 && cp hosts/mcpb/manifest.json dist/mcpb/manifest.json && npx -y @anthropic-ai/mcpb@2.1.2 pack dist/mcpb dist/release/papervizagent.mcpb
      - name: OpenClaw plugin tarball
        run: npm --prefix hosts/openclaw install && npm --prefix hosts/openclaw run build && npm pack ./hosts/openclaw --pack-destination dist/release
      - name: DSH bundle tarball
        run: npm pack ./hosts/dsh --pack-destination dist/release
      - name: plugin bundle
        run: set -- plugin.json mcp.json skills .claude-plugin .codex-plugin .cursor-plugin; for path in LICENSE LICENSE.md LICENSE.txt NOTICE NOTICE.md NOTICE.txt; do if [ -f "$path" ]; then set -- "$@" "$path"; fi; done; zip -qr dist/release/papervizagent-plugin.zip "$@"
      - name: web tarball
        run: tar -czf dist/release/papervizagent-web.tar.gz -C web/dist .
      - name: browser extension zips
        working-directory: hosts/browser
        run: |-
          npm install
          npm exec --no -- wxt zip -b chrome
          npm exec --no -- wxt zip -b firefox
          npm exec --no -- wxt zip -b edge
          cp .output/papervizagent-0.4.0-{chrome,firefox,edge,sources}.zip ../../dist/release/
          cd ../..
          git archive --format=zip --output=dist/release/papervizagent-0.4.0-sources.zip HEAD
          zip -q dist/release/papervizagent-0.4.0-sources.zip web/src/ops.json
      - name: Firefox signed xpi (only when FIREFOX_JWT_ISSUER/FIREFOX_JWT_SECRET are set)
        run: if [ -n "$FIREFOX_JWT_ISSUER" ] && [ -n "$FIREFOX_JWT_SECRET" ]; then npm --prefix hosts/browser exec --no -- web-ext sign --channel=unlisted --api-key="$FIREFOX_JWT_ISSUER" --api-secret="$FIREFOX_JWT_SECRET" --source-dir hosts/browser/.output/firefox-mv2 --artifacts-dir dist/release; fi
      - name: coverage report
        run: cp COVERAGE.md dist/release/ && npx --yes toolfactory@0.2.1 coverage > dist/release/coverage.json
      - uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: dist/release/
  publish-npm:
    needs:
      - gate
      - package
    if: needs.gate.outputs.npm == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      NPM_TRUSTED_PUBLISHER: ${{ vars.NPM_TRUSTED_PUBLISHER }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: release-assets
      - name: npm publish
        env:
          NPM_TOKEN: ${{ vars.NPM_TRUSTED_PUBLISHER != 'true' && secrets.NPM_TOKEN || '' }}
        run: 'if npm view papervizagent@0.4.0 version >/dev/null 2>&1; then echo "::notice::npm: papervizagent@0.4.0 already published; skipping immutable version."; elif [ "$NPM_TRUSTED_PUBLISHER" = true ]; then npm publish ./release-assets/papervizagent-0.4.0.tgz --access public; else NODE_AUTH_TOKEN="$NPM_TOKEN" npm publish ./release-assets/papervizagent-0.4.0.tgz --access public; fi'
  publish-pypi:
    needs:
      - gate
      - package
    if: needs.gate.outputs.pypi == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: release-assets
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: release-assets/pypi/
  publish-oci:
    needs: gate
    if: needs.gate.outputs.oci == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: install
        run: uv sync --frozen
      - name: generate container build inputs
        run: npx --yes toolfactory@0.2.1 build
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/goatinahat/papervizagent
          tags: type=semver,pattern={{version}},value=${{ inputs.tag || github.ref_name }}
          labels: io.modelcontextprotocol.server.name=io.github.GoatInAHat/papervizagent
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: container runtime smoke
        env:
          IMAGE: ghcr.io/goatinahat/papervizagent:${{ steps.meta.outputs.version }}
        run: >-
          docker run --rm --entrypoint python "$IMAGE" -c
          'from importlib.resources import files; from papervizagent.toolfactory.cli import main;
          assert (files("papervizagent") / "web/index.html").is_file(); main(["status"])'
  publish-mcp-registry:
    needs:
      - gate
      - publish-npm
      - publish-pypi
      - publish-oci
    if: needs.gate.outputs.mcp_registry == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.sha }}
      - run: curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
      - run: ./mcp-publisher login github-oidc && ./mcp-publisher publish
  publish-clawhub:
    permissions:
      actions: read
      contents: read
      id-token: write
    if: ${{ !cancelled() && needs.package.result == 'success' && !contains(needs.*.result, 'failure') && needs.gate.outputs.clawhub_package == 'true' }}
    needs:
      - gate
      - package
      - publish-npm
      - publish-pypi
      - publish-oci
      - publish-mcp-registry
    uses: openclaw/clawhub/.github/workflows/package-publish.yml@main
    with:
      package_artifact_name: release-assets
      package_artifact_path: openclaw-plugin-papervizagent-0.4.0.tgz
      dry_run: false
      wait_for_publication: true
    secrets:
      clawhub_token: ${{ secrets.CLAWHUB_TOKEN }}
  publish-clawhub-skill:
    permissions:
      contents: read
      id-token: write
    if: needs.gate.outputs.clawhub_skill == 'true'
    needs: gate
    uses: openclaw/clawhub/.github/workflows/skill-publish.yml@main
    with:
      skill_path: skills/papervizagent
      dry_run: false
    secrets:
      clawhub_token: ${{ secrets.CLAWHUB_TOKEN }}
  publish-browser-ext:
    needs:
      - gate
      - package
    if: needs.gate.outputs.chrome == 'true' || needs.gate.outputs.firefox == 'true' || needs.gate.outputs.edge == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CHROME_API_VERSION: v2
      CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
      CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
      CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
      CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}
      FIREFOX_EXTENSION_ID: ${{ secrets.FIREFOX_EXTENSION_ID }}
      FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
      FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
      EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
      EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
      EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: npm --prefix hosts/browser install
      - uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: release-assets
      - name: wxt submit --dry-run (zips, plus a live credential read for Chrome and Firefox)
        run: |-
          flags=()
          if [ -n "$CHROME_EXTENSION_ID" ] && [ -n "$CHROME_PUBLISHER_ID" ] && [ -n "$CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL" ] && [ -n "$CHROME_SERVICE_ACCOUNT_PRIVATE_KEY" ]; then flags+=(--chrome-zip release-assets/papervizagent-0.4.0-chrome.zip); fi
          if [ -n "$FIREFOX_EXTENSION_ID" ] && [ -n "$FIREFOX_JWT_ISSUER" ] && [ -n "$FIREFOX_JWT_SECRET" ]; then flags+=(--firefox-zip release-assets/papervizagent-0.4.0-firefox.zip --firefox-sources-zip release-assets/papervizagent-0.4.0-sources.zip); fi
          if [ -n "$EDGE_PRODUCT_ID" ] && [ -n "$EDGE_CLIENT_ID" ] && [ -n "$EDGE_API_KEY" ]; then flags+=(--edge-zip release-assets/papervizagent-0.4.0-edge.zip); fi
          if [ "${#flags[@]}" -eq 0 ]; then echo "No browser store credentials configured; skipping wxt submit."; exit 0; fi
          npm --prefix hosts/browser exec --no -- wxt submit --dry-run "${flags[@]}"
      - name: wxt submit
        run: |-
          flags=()
          if [ -n "$CHROME_EXTENSION_ID" ] && [ -n "$CHROME_PUBLISHER_ID" ] && [ -n "$CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL" ] && [ -n "$CHROME_SERVICE_ACCOUNT_PRIVATE_KEY" ]; then flags+=(--chrome-zip release-assets/papervizagent-0.4.0-chrome.zip); fi
          if [ -n "$FIREFOX_EXTENSION_ID" ] && [ -n "$FIREFOX_JWT_ISSUER" ] && [ -n "$FIREFOX_JWT_SECRET" ]; then flags+=(--firefox-zip release-assets/papervizagent-0.4.0-firefox.zip --firefox-sources-zip release-assets/papervizagent-0.4.0-sources.zip); fi
          if [ -n "$EDGE_PRODUCT_ID" ] && [ -n "$EDGE_CLIENT_ID" ] && [ -n "$EDGE_API_KEY" ]; then flags+=(--edge-zip release-assets/papervizagent-0.4.0-edge.zip); fi
          if [ "${#flags[@]}" -eq 0 ]; then echo "No browser store credentials configured; skipping wxt submit."; exit 0; fi
          npm --prefix hosts/browser exec --no -- wxt submit "${flags[@]}"
  release:
    needs:
      - gate
      - package
      - publish-npm
      - publish-pypi
      - publish-oci
      - publish-mcp-registry
      - publish-clawhub
      - publish-clawhub-skill
      - publish-browser-ext
    if: ${{ !cancelled() && needs.package.result == 'success' && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      pages: write
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: install
        run: uv sync
      - name: unpublish dropped registries
        run: npx --yes toolfactory@0.2.1 unpublish
        env:
          GH_TOKEN: ${{ github.token }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
          CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}
          FIREFOX_EXTENSION_ID: ${{ secrets.FIREFOX_EXTENSION_ID }}
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
      - uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: release-assets
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ needs.gate.outputs.sha }}
          generate_release_notes: true
          files: |-
            release-assets/*
            release-assets/pypi/*
          fail_on_unmatched_files: true
  pages-build:
    needs: gate
    if: needs.gate.outputs.pages == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: install
        run: uv sync
      - name: toolfactory build (output files)
        run: npx --yes toolfactory@0.2.1 build
      - uses: actions/configure-pages@v5
      - name: web build
        env:
          PAGES_BASE: /${{ github.event.repository.name }}/
        run: npm -C web ci && npm -C web run build
      - name: publish the schema and the coverage report alongside the app
        run: cp dev.toolfactory/tool.schema.json COVERAGE.md web/dist/ && npx --yes toolfactory@0.2.1 coverage > web/dist/coverage.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
  pages-deploy:
    needs: pages-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
